name: Runtime signer source build

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_runtime_signer.sh
      - scripts/runtime-signer/**
      - .github/workflows/runtime-signer.yml
  pull_request:
    paths:
      - scripts/build_runtime_signer.sh
      - scripts/runtime-signer/**
      - .github/workflows/runtime-signer.yml

permissions:
  contents: read

jobs:
  build-runtime-signer:
    name: Build iOS arm64 codex-sign from pinned sources
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Select available Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$candidate" ]; then
            sudo xcode-select -s "$candidate/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Shell and Objective-C syntax checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build_runtime_signer.sh
          # The full adapter syntax gate runs after the pinned headers are
          # fetched by build_runtime_signer.sh; this step is intentionally only
          # a shell gate and never masks a failed Objective-C build.

      - name: Build signer and fixed source assets
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_runtime_signer.sh \
            --output "$RUNNER_TEMP/codex-sign"
          test -x "$RUNNER_TEMP/codex-sign"
          file "$RUNNER_TEMP/codex-sign"
          xcrun lipo -info "$RUNNER_TEMP/codex-sign"
          test -f build/runtime-signer/work/provenance.json
          test -f build/runtime-signer/work/source-assets.tar.gz

      - name: Verify source provenance and output contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('build/runtime-signer/work/provenance.json')
          d = json.loads(p.read_text())
          assert d['source_build'] is True
          assert d['target'] == 'arm64-apple-ios15.0'
          assert d['trollstore']['commit'] == '88424f683b2a08f34a3f88985f790f97d84ce1df'
          assert d['choma']['commit'] == '964023ddac2286ef8e843f90df64d44ac6a673df'
          assert d['openssl']['sha256'] == '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a'
          assert d['runtime_policy']['adhoc_only_never_calls_coretrust'] is True
          print('provenance contract: ok')
          PY

      - name: Upload source-built signer and provenance
        uses: actions/upload-artifact@v4
        with:
          name: codex-sign-ios-arm64-source-built
          path: |
            ${{ runner.temp }}/codex-sign
            build/runtime-signer/work/provenance.json
            build/runtime-signer/work/source-assets.tar.gz
          if-no-files-found: error
          retention-days: 14
