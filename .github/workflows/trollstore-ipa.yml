name: TrollStore TIPA
# [T-run-name] check 与 release 在运行列表里必须一眼可辨——两者都叫
# "TrollStore TIPA" 时，看到 check 运行「没有产物」会被误判成构建失败。
run-name: "${{ inputs.mode == 'check' && 'compile check' || 'TIPA release' }}"

# 出 TrollStore 可直装的 .tipa（adhoc 签名 + 原生编译所需权限）
# 触发：手动 / push tag
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image. macos-26-intel is the only image that reliably allocates right now; arm64 images queue for hours."
        type: choice
        options: [macos-26-intel, macos-15-intel, macos-26, macos-15, macos-14]
        default: macos-26-intel
      xcode_version:
        description: "Wanted Xcode major.minor (falls back to the newest installed Xcode with the same major)"
        type: string
        default: "26.6"
      dd_cache:
        description: "Reuse the previous run's DerivedData for incremental compiles (much faster; ~0.6 GB of the 10 GB cache budget)"
        type: boolean
        default: true
      mode:
        description: "release = full TIPA; check = Debug incremental compile only (no signing/packaging) for fast error feedback"
        type: choice
        options: [release, check]
        default: release
  push:
    tags: ["v*"]

# [ci-queue] 绝对不要用固定的 concurrency group。
# GitHub 的规则是：同一 group 里出现新的「排队中」运行，会**取消掉之前还在
# pending 的那个**（不是 cancel-in-progress 才有的行为）。macOS runner 紧张时
# job 长时间 pending，于是每次手动重开都会把上一个还在等的运行掐死，看起来
# 就像「永远构建不了」。这里让每次 workflow_dispatch 各自成组（用 run_id），
# 手动触发的运行只会排队、不会互相取消；只有同一 ref 的 tag push 之间做串行。
concurrency:
  group: tipa-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: false

jobs:
  build:
    # macos-26-intel: x86_64 macOS 26 镜像，自带 Xcode 26.6 / iPhoneOS SDK 26.5，
    # 分配几乎是即时的。macos-15 / macos-26（arm64）在高峰期会 pending 数小时，
    # 所以默认值改成 intel 镜像；确实需要 arm64 时用手动触发时的 runner 选项。
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 300
    steps:
      - name: Runner info
        run: |
          uname -m
          sw_vers
          ls /Applications | grep -E '^Xcode' || true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Select Xcode
        run: |
          set -euo pipefail
          WANTED="${{ inputs.xcode_version || '26.6' }}"
          MAJOR="${WANTED%%.*}"
          echo "wanted=$WANTED major=$MAJOR"
          # 1) exact match, 2) newest installed Xcode with the same major, 3) image default.
          CAND="/Applications/Xcode_${WANTED}.app"
          if [ ! -d "$CAND" ]; then
            CAND=$(ls -d /Applications/Xcode_${MAJOR}.*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -n "${CAND:-}" ] && [ -d "$CAND" ]; then
            echo "::notice::selecting $CAND"
            sudo xcode-select -s "$CAND/Contents/Developer"
          else
            echo "::warning::no Xcode $MAJOR.x on this image; keeping the image default"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Normalize source mtimes (makes DerivedData genuinely reusable)
        run: |
          # actions/checkout stamps every file with "now". llbuild then considers every
          # source newer than the restored build products and happily rebuilds all 700
          # Swift files, which is exactly why a restored .dd gave almost no speedup.
          # Pin source mtimes to a constant *before* the cache step, so a restored .dd
          # (mtime = restore time) is unambiguously newer and gets reused.
          find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -exec touch -t 200001010000 {} + || true
          find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type d -exec touch -t 200001010000 {} + || true
          echo "source mtimes pinned; $(find "$GITHUB_WORKSPACE/src" -name '*.swift' | wc -l) swift files"

      - name: Prepare configs
        run: |
          set -euo pipefail
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig
          cp src/android/app/provider-customization.properties.example \
             src/android/app/provider-customization.properties || true
          # 生成的配置也要钉住 mtime，否则每次都会让上游 target 判脏
          touch -t 200001010000 src/ios/Configs/ProviderCustomization.xcconfig \
                                 src/android/app/provider-customization.properties || true

      - name: Setup Go (rclone needs the toolchain pinned by go.mod)
        uses: actions/setup-go@v5
        with:
          # deps/rclone-mobile/go.mod declares go 1.25.5. Newer toolchains break
          # go-json-experiment/json (undefined json.SkipFunc / DiscardUnknownMembers).
          go-version: '1.25.x'
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Cache LAME
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/lame-3.100
          key: lame-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps/build_lame.sh') }}
          restore-keys: lame-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache FFmpeg frameworks
        uses: actions/cache@v4
        with:
          path: |
            deps/frameworks
            deps/ffmpeg-6.1.2
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps/build_ffmpeg.sh', 'deps/ffmpeg-patch/**') }}
          restore-keys: ffmpeg-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache iSH + Alpine rootfs
        uses: actions/cache@v4
        with:
          path: |
            deps/libs
            deps/include
            deps/resources
            deps/.cache
            deps/ish/build-ios
            deps/ish/build-native
          key: ish-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps/build_ish.sh', 'deps/prepare_alpine_rootfs.sh') }}
          restore-keys: ish-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache rclone xcframework
        uses: actions/cache@v4
        with:
          path: |
            deps/build/rclone
            deps/frameworks/Rclone.xcframework
          key: rclone-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps/build_rclone_ios.sh', 'deps/rclone-mobile/go.mod', 'deps/rclone-mobile/go.sum') }}
          restore-keys: rclone-${{ runner.os }}-${{ runner.arch }}-

      - name: Build native deps
        run: |
          set -euo pipefail
          brew install nasm yasm pkg-config cmake automake libtool texi2html meson ninja llvm lld libarchive || true
          # Homebrew lives at /opt/homebrew on arm64 and /usr/local on Intel, so
          # never hardcode either one: derive it from `brew --prefix`.
          BREW="$(brew --prefix)"
          echo "brew prefix: $BREW"
          # libarchive is keg-only ("provided_by_macos") so Homebrew does not link
          # it into the prefix; prepare_alpine_rootfs.sh needs libarchive to build
          # the host-side fakefsify tool.
          export CPPFLAGS="-I$BREW/opt/libarchive/include ${CPPFLAGS:-}"
          export LDFLAGS="-L$BREW/opt/libarchive/lib ${LDFLAGS:-}"
          export PKG_CONFIG_PATH="$BREW/opt/libarchive/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          ls -la "$BREW/opt/libarchive/lib/" | head -5
          echo "$BREW/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "$BREW/opt/lld/bin" >> "$GITHUB_PATH"
          export PATH="$BREW/opt/llvm/bin:$BREW/opt/lld/bin:$PATH"
          which clang && clang --version | head -1
          # iSH's arm64 VDSO target hardcodes `-fuse-ld=lld` for an
          # aarch64-linux-gnu ELF link; Homebrew's llvm keg does not ship
          # ld.lld, so the separate `lld` formula must be on PATH or clang
          # reports "invalid linker name in argument '-fuse-ld=lld'".
          which ld.lld && ld.lld --version | head -1
          python3 -m pip install --user --break-system-packages meson ninja || pip3 install --user meson ninja || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          which meson || python3 -m mesonbuild.mesonmain --version || true
          chmod +x deps/*.sh
          [ -f deps/lame-build/lib/libmp3lame.a ] || ./deps/build_lame.sh
          [ -d deps/frameworks/FFmpeg.xcframework ] || ./deps/build_ffmpeg.sh
          [ -f deps/libs/libish.a ] || ./deps/build_ish.sh
          [ -f deps/resources/alpine-rootfs.zip ] || ./deps/prepare_alpine_rootfs.sh
          [ -d deps/frameworks/Rclone.xcframework ] || ./deps/build_rclone_ios.sh
          ls -la deps/frameworks | head -20

      - name: Install ldid
        run: |
          brew install ldid || true
          which ldid && ldid -h | head -3 || echo "ldid missing"

      - name: Verify bundled native runtime helpers
        if: ${{ inputs.mode != 'check' }}
        run: |
          set -euo pipefail
          # The release is intentionally self-contained: the exact helper
          # inputs are checked into Configs/Helpers from the supplied MT
          # reference. The source-rebuild workflow is separate and must never
          # silently turn a release into an app without its signer.
          test -x "$GITHUB_WORKSPACE/Configs/Helpers/codex-sign"
          test -x "$GITHUB_WORKSPACE/Configs/Helpers/bash.real"
          test -f "$GITHUB_WORKSPACE/Configs/Helpers/provenance.json"
          test -d "$GITHUB_WORKSPACE/Configs/Helpers/Notices"
          sha256sum "$GITHUB_WORKSPACE/Configs/Helpers/codex-sign" \
                    "$GITHUB_WORKSPACE/Configs/Helpers/bash.real" \
                    "$GITHUB_WORKSPACE/Configs/Helpers/provenance.json"

      - name: Cache DerivedData (incremental Swift)
        if: ${{ inputs.dd_cache != false }}
        uses: actions/cache@v4
        with:
          path: ${{ inputs.mode == 'check' && '.dd-check' || '.dd' }}
          # 每个 run 存一份新的（run_id 唯一），restore 用前缀取「最近一份」。
          # GitHub 缓存按 10GB / 7 天 LRU 淘汰，若挤掉 native deps 缓存请关闭此输入。
          key: dd-${{ inputs.mode || 'release' }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            dd-${{ inputs.mode || 'release' }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile check (Debug, incremental)
        if: ${{ inputs.mode == 'check' }}
        run: |
          set -euo pipefail
          cd src/ios
          DD="$GITHUB_WORKSPACE/.dd-check"
          xcchk() {
            xcodebuild \
              -project Minis.xcodeproj \
              -scheme Minis \
              -configuration Debug \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$DD" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              build 2>&1 | tee /tmp/check.log
          }
          set +e
          xcchk
          rc=$?
          set -e
          if [ $rc -ne 0 ] && grep -q 'error:' /tmp/check.log; then
            echo "::warning::compile failed; retrying once with a clean DerivedData (restored cache may be stale)"
            rm -rf "$DD"
            xcchk || { echo "::error::compile check failed"; grep -n 'error:' /tmp/check.log | head -40; exit 1; }
          elif [ $rc -ne 0 ]; then
            echo "::error::compile check failed"; tail -60 /tmp/check.log; exit 1
          fi
          echo "::notice::compile check passed ($(grep -c 'Compiling\|SwiftCompile' /tmp/check.log || true) compile steps)"

      - name: Build (unsigned)
        if: ${{ inputs.mode != 'check' }}
        run: |
          set -euo pipefail
          cd src/ios
          DD="$GITHUB_WORKSPACE/.dd"
          xcbuild() {
            xcodebuild \
              -project Minis.xcodeproj \
              -scheme Minis \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$DD" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              build
          }
          if ! xcbuild; then
            echo "::warning::build failed; retrying once with a clean DerivedData (restored cache may be stale)"
            rm -rf "$DD"
            xcbuild
          fi
          APP="$DD/Build/Products/Release-iphoneos/Minis.app"
          test -d "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "DSYM=$DD/Build/Products/Release-iphoneos/Minis.app.dSYM" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" || true

      - name: Sign + package tipa
        if: ${{ inputs.mode != 'check' }}
        run: |
          set -euo pipefail
          APP="$APP"
          ENT="$GITHUB_WORKSPACE/Configs/TrollStore.entitlements"

          # 每次构建写一个唯一的 CFBundleVersion，否则所有包都显示 1.15(14)，
          # 设备上根本分不清装的是哪一版（排查崩溃时这点很致命）。
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist" || true

          # [T-sign-all-macho] 不能只看 -perm -111：framework 里的 .dylib 经常
          # 没有执行位，但 dyld 照样会加载它；漏签的后果在设备上是 EPERM 或
          # "Library not loaded"，而日志里只写「无法启动进程」。
          # 顺序：先签所有内嵌 Mach-O，最后签主二进制。
          find "$APP" -type f -print > /tmp/allfiles.txt
          while IFS= read -r f; do
            case "$f" in
              "$APP/Minis") continue ;;
            esac
            if file "$f" | grep -q "Mach-O"; then
              ldid -S"$ENT" "$f" || ldid -S "$f"
            fi
          done < /tmp/allfiles.txt
          ldid -S"$ENT" "$APP/Minis"

          # 打包前确认权限真的写进去了：少了 no-sandbox / platform-application，
          # 设备上任何 posix_spawn 都会失败，而报错信息只会说「无法启动进程」。
          ENTS="$(ldid -e "$APP/Minis" || true)"
          MISSING=""
          for key in no-sandbox platform-application skip-library-validation; do
            printf '%s' "$ENTS" | grep -q "$key" || MISSING="$MISSING $key"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::signed main binary is missing entitlements:$MISSING"
            printf '%s\n' "$ENTS" | head -40
            exit 1
          fi
          echo "entitlements verified: no-sandbox / platform-application / skip-library-validation"

          mkdir -p "$RUNNER_TEMP/out/Payload"
          cp -R "$APP" "$RUNNER_TEMP/out/Payload/"
          cd "$RUNNER_TEMP/out"
          zip -qry "$GITHUB_WORKSPACE/Minis-NativeBuild.tipa" Payload
          cd "$GITHUB_WORKSPACE"
          ls -la Minis-NativeBuild.tipa
          shasum -a 256 Minis-NativeBuild.tipa

      - name: Upload TIPA
        if: ${{ inputs.mode != 'check' }}
        uses: actions/upload-artifact@v4
        with:
          name: Minis-NativeBuild-tipa
          path: Minis-NativeBuild.tipa
          retention-days: 14

      - name: Upload dSYM (crash symbolication)
        if: ${{ always() && inputs.mode != 'check' }}
        uses: actions/upload-artifact@v4
        with:
          name: Minis-dSYM
          path: ${{ env.DSYM }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "### TrollStore TIPA"
            echo "- mode: \`${{ inputs.mode || 'release' }}\`"
            echo "- build: \`${{ github.run_number }}\`"
            echo "- runner: \`${{ inputs.runner || 'macos-26-intel' }}\`"
            echo "- xcode: \`${{ inputs.xcode_version || '26.6' }}\`"
            echo "- dd-cache: \`${{ inputs.dd_cache != false }}\`"
            echo "- status: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
