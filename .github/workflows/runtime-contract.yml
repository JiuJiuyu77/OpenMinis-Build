# Guard the developer-runtime contract.
#
# The runtime manifest is data, so a new or edited runtime reaches users without
# an app build — which also means a bad entry ships straight to devices. This
# workflow fails when the published manifest advertises something the installer
# in this branch cannot honour (unknown handler, unsupported archive format,
# digests that are not 64-hex, an `install` block that would let a broken tree
# pass the new self-check), and it parses the runtime Swift sources so a syntax
# error is caught without a full IPA build.
#
# Runs daily as well: the manifest changes out of band.

name: Runtime contract

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - "scripts/check_runtime_manifest.py"
      - "src/ios/Agent/Runtime/**"
      - "src/ios/Agent/NativeBuild/**"
      - "src/ios/Views/Settings/DeveloperRuntimeSettingsView.swift"
      - "scripts/stage_app_helpers.sh"
      - "src/ios/Minis.xcodeproj/project.pbxproj"
      - "scripts/check_xcode_project_files.py"
      - ".github/workflows/runtime-contract.yml"
  pull_request:
    paths:
      - "scripts/check_runtime_manifest.py"
      - "src/ios/Agent/Runtime/**"
      - "src/ios/Agent/NativeBuild/**"
      - "src/ios/Views/Settings/DeveloperRuntimeSettingsView.swift"
      - "scripts/stage_app_helpers.sh"
      - ".github/workflows/runtime-contract.yml"

permissions:
  contents: read

env:
  MANIFEST_URL: https://raw.githubusercontent.com/JiuJiuyu77/MinisApp-Runtime/main/Runtime/runtime-manifest.json

jobs:
  manifest:
    name: Published manifest stays installable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Python version
        run: python3 -V

      - name: "Check the live manifest (3 attempts, raw.githubusercontent is flaky)"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "::group::attempt $attempt"
            if python3 scripts/check_runtime_manifest.py --manifest "$MANIFEST_URL"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            sleep $((attempt * 5))
          done
          echo "manifest check failed after 3 attempts" >&2
          exit 1

      - name: Installer handlers the app actually implements
        run: |
          echo "Supported handlers: portable-v1, codex, python, theos, reverse_tools"
          echo "Supported archives: .tar.gz, .tgz, .deb (data.tar.gz / data.tar.zst)"
          grep -n "SUPPORTED_HANDLERS\|SUPPORTED_ARCHIVES" scripts/check_runtime_manifest.py | head -5

  swift-syntax:
    name: Runtime sources parse
    # ubuntu-latest rolled to 26.04, which swift-actions/setup-swift does not
    # support yet ("Version 26.04 of Ubuntu is not supported"). Pin the runner
    # instead of chasing the alias.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: swiftc -parse (syntax only, no iOS SDK needed)
        run: |
          set -euo pipefail
          swiftc -version
          swiftc -parse src/ios/Agent/Runtime/*.swift
          swiftc -parse src/ios/Agent/NativeBuild/IPAShellPacker.swift \
                        src/ios/Agent/NativeBuild/NativeBuildService.swift \
                        src/ios/Agent/NativeBuild/RuntimeRepair.swift \
                        src/ios/Agent/NativeBuild/NativeCommandRunner.swift \
                        src/ios/Agent/NativeBuild/ToolExecutorPreference.swift \
                        src/ios/Agent/NativeBuild/NativeToolchain.swift
          swiftc -parse src/ios/Views/Settings/DeveloperRuntimeSettingsView.swift \
                        src/ios/Views/Settings/RuntimeDiagnosticsView.swift \
                        src/ios/Views/Settings/SettingsSheet.swift
          echo "runtime sources parse cleanly"

      - name: Install gates are wired
        run: |
          set -euo pipefail
          # 这几处是适配点，被回退时立刻可见：
          #   自检 → 签名 → 环境 overlay → 能力级依赖
          grep -q "RuntimeInstallVerifier.verify" src/ios/Agent/Runtime/DeveloperRuntimeManager.swift
          grep -q "RuntimeSigner.signRuntime" src/ios/Agent/Runtime/DeveloperRuntimeManager.swift
          grep -q "RuntimeEnvironmentOverlay.build" src/ios/Agent/Runtime/DeveloperRuntimeManager.swift
          grep -q "installSpecOrNone" src/ios/Agent/Runtime/RuntimeManifest.swift
          grep -q "minis-sign" src/ios/Agent/Runtime/RuntimeSigning.swift
          grep -q "RuntimeSigner.signArtifacts" src/ios/Agent/NativeBuild/IPAShellPacker.swift
          grep -q "RuntimeSigner.signArtifacts" src/ios/Agent/NativeBuild/NativeBuildService.swift
          grep -q "CapabilityID.nodeRuntime" src/ios/Agent/Runtime/BuiltinCapabilities.swift
          grep -q "unsupportedHandlers" src/ios/Agent/Runtime/DeveloperRuntimeManager.swift
          grep -q "nativeLayers" src/ios/Views/Settings/RuntimeDiagnosticsView.swift
          grep -q "RuntimeSigner.locateMinisSign" src/ios/Views/Settings/RuntimeDiagnosticsView.swift
          # 借来的运行时目录必须保持删除状态（回归守卫）：
          if grep -rq "nativeToolchain.reuseExternalRuntime\|toolExecutor.preferCustomRuntime" src/ios --include=*.swift; then
            echo "borrowed-runtime switch is back in the executor" >&2
            exit 1
          fi
          echo "self-check + signing + environment overlay are wired into the manager"

      - name: Every Swift file is registered in the Xcode project
        run: |
          set -euo pipefail
          # Agent/Runtime 与 Views 是经典 group，新文件必须手工登记 pbxproj；
          # 漏登记在 App 构建时报 "cannot find type X in scope"（正式版曾因此失败）。
          python3 scripts/check_xcode_project_files.py --strict

      - name: Localization coverage report
        run: |
          set -euo pipefail
          python3 scripts/check_localization_keys.py | tail -5

      - name: Shell scripts parse
        run: |
          set -euo pipefail
          bash -n scripts/stage_app_helpers.sh
          echo "stage_app_helpers.sh parses"

      - name: Helper staging phase is wired into the app target
        run: |
          set -euo pipefail
          # 脚本只有真被 Xcode 调用才有意义：没有这个 Run Script 阶段，
          # 包里就没有 Helpers/bash.real 与 minis-sign，签名层只能退化成 adhoc。
          project=src/ios/Minis.xcodeproj/project.pbxproj
          grep -q 'Stage App Helpers' "$project" \
            || { echo "Stage App Helpers build phase missing from the app target" >&2; exit 1; }
          grep -q 'scripts/stage_app_helpers.sh' "$project" \
            || { echo "the build phase does not call stage_app_helpers.sh" >&2; exit 1; }
          # 路径必须能从 src/ios 解析出来：写成 ../scripts/... 就会在构建时
          # 「No such file or directory」把整个 App 编译搞挂（踩过一次）。
          script_path=$(grep -o '${SRCROOT}/[^"]*stage_app_helpers.sh' "$project" | head -1 | sed 's|${SRCROOT}/||')
          test -n "$script_path" || { echo "cannot read the script path from the build phase" >&2; exit 1; }
          test -f "src/ios/$script_path" || {
            echo "build phase path does not resolve: src/ios/$script_path" >&2; exit 1; }
          echo "ok: stage_app_helpers.sh resolves from SRCROOT"

          # 阶段必须挂在应用 target 的 buildPhases 里，而不只是定义在工程里。
          awk '/isa = PBXNativeTarget;/{tgt=1} tgt && /buildPhases = \(/{ph=1} ph && /Stage App Helpers/{found=1} ph && /\);/{if(found){print "ok: staged in target"; exit 0}; ph=0}' "$project" \
            | grep -q 'ok: staged' || { echo "build phase is not attached to a target" >&2; exit 1; }
          echo "ok: helper staging is wired"

      - name: Helper staging is a no-op without binaries
        run: |
          set -euo pipefail
          # 没有 Configs/Helpers 时，构建阶段脚本必须安静退出而不是失败。
          products=$(mktemp -d)
          out=$(BUILT_PRODUCTS_DIR="$products" WRAPPER_NAME=Minis.app bash scripts/stage_app_helpers.sh)
          echo "$out"
          case "$out" in
            *"nothing to stage"*) echo "ok: no-op path works" ;;
            *) echo "unexpected output" >&2; exit 1 ;;
          esac
